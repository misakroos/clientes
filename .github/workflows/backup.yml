name: Respaldo Diario a Google Drive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm init -y
          npm install @supabase/supabase-js ws

      - name: Exportar a Drive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const WebSocket = require('ws');

          async function main() {
            const supabase = createClient(
              process.env.SUPABASE_URL,
              process.env.SUPABASE_SERVICE_ROLE_KEY,
              {
                auth: { persistSession: false },
                realtime: {
                  transport: WebSocket,
                  timeout: 20000
                }
              }
            );

            const tables = ['clients', 'services', 'suppliers', 'purchases', 'accounts', 'account_slots', 'sales', 'sale_items', 'slot_assignments', 'cash_movements', 'activity_log', 'renewal_finance'];
            const backupData = { date: new Date().toISOString(), tables: {} };

            for (const table of tables) {
              const { data, error } = await supabase.from(table).select('*');
              if (error) console.error('Error descargando tabla ' + table, error);
              else backupData.tables[table] = data || [];
            }

            const response = await fetch(process.env.DRIVE_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ backupData }),
              redirect: 'follow'
            });

            const resText = await response.text();
            console.log('Respuesta de Google Drive:', resText);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          "
