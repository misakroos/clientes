<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MISAKROOS CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#10243c;--line:#1d3553;--text:#f4f7fb;--muted:#9bb0c9;--accent:#2f80ff;--danger:#ff5d6c;--warn:#ffbd4a;--ok:#37d67a}
*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#081522}.topbar{position:sticky;top:0;z-index:10;background:#07111fee;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.main{padding:14px 14px 90px}.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}.metric b{display:block;font-size:22px}.muted{color:var(--muted)}.tiny{font-size:12px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.hidden{display:none!important}.sectionTitle{font-weight:800;font-size:18px;margin:4px 0 12px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:var(--panel2);color:#fff;border:1px solid var(--line)}.warn{background:#33250d;color:#ffd47a;border:1px solid #6a4b13}.danger{background:#321117;color:#ff9ba4;border:1px solid #6b222b}.ok{background:#0d2d1d;color:#83efac;border:1px solid #216e44}.small{padding:7px 9px;font-size:12px}input,select,textarea{width:100%;background:#071421;color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 5px}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#07111ff5;border-top:1px solid var(--line);padding:7px}.navbtn{background:none;border:0;color:var(--muted);font-size:11px;padding:7px}.navbtn.active{color:#fff}.navbtn b{display:block;font-size:18px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#091725;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.badge{padding:4px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
.hint{margin-top:7px;padding:9px 10px;border-radius:11px;background:#0b2034;border:1px solid #244766;color:#b9cbe0;font-size:12px}
.inlineNew{margin-top:8px;padding:10px;border:1px dashed #34577a;border-radius:12px;background:#081b2c}
.saleRow{position:relative}.removeRow{position:absolute;right:10px;top:10px}
.datalistInput{position:relative}
.extractor{background:#071b2b;border:1px solid #284a69;border-radius:14px;padding:12px;margin-bottom:12px}
.extractor textarea{min-height:120px}
.deliveryPreview{white-space:pre-wrap;background:#071421;border:1px solid var(--line);padding:12px;border-radius:12px;font-size:13px;line-height:1.45}
.checkrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.checkrow input{width:auto}

hr{border:0;border-top:1px solid var(--line);margin:13px 0}
</style>
</head>
<body>
<div id="authView" class="auth"><div class="authbox"><h1>Bienvenido a MISAKROOS</h1><p class="muted">Accedé con tus datos para gestionar clientes, ventas, cuentas y renovaciones.</p><label>Correo</label><input id="loginEmail" type="email"><label>Contraseña</label><input id="loginPassword" type="password"><button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">Iniciar sesión</button><div id="loginMsg" class="tiny muted" style="margin-top:8px"></div></div></div>
<div id="appView" class="app hidden"><div class="topbar"><b>MISAKROOS CRM</b><button class="btn secondary small" onclick="logout()">Salir</button></div><div class="main">
<section id="screen-home"><div class="grid2"><div class="metric"><b id="mClients">0</b><span class="muted tiny">Clientes</span></div><div class="metric"><b id="mPending">0</b><span class="muted tiny">Pendientes</span></div><div class="metric"><b id="mSlots">0</b><span class="muted tiny">Cupos libres</span></div><div class="metric"><b id="mExpiring">0</b><span class="muted tiny">Vencen ≤ 7 días</span></div></div><div class="card" style="margin-top:12px"><div class="sectionTitle">Accesos rápidos</div><div class="grid2"><button class="btn primary" onclick="openSaleModal()">+ Venta</button><button class="btn secondary" onclick="openPurchaseModal()">+ Compra</button><button class="btn secondary" onclick="openClientModal()">+ Cliente</button><button class="btn secondary" onclick="openAccountModal()">+ Cuenta</button></div></div><div class="card"><div class="sectionTitle">Próximos a vencer</div><div id="homeExpiring"></div></div></section>
<section id="screen-clients" class="hidden"><div class="row between"><div class="sectionTitle">Clientes</div><button class="btn primary small" onclick="openClientModal()">+ Agregar</button></div><input id="clientSearch" placeholder="Buscar..." oninput="renderClients()"><div id="clientsList" style="margin-top:10px"></div></section>
<section id="screen-sales" class="hidden"><div class="row between"><div class="sectionTitle">Ventas</div><button class="btn primary small" onclick="openSaleModal()">+ Venta</button></div><div id="salesList"></div></section>
<section id="screen-accounts" class="hidden"><div class="row between"><div class="sectionTitle">Cuentas</div><button class="btn primary small" onclick="openAccountModal()">+ Cuenta</button></div><div id="accountsList"></div></section>
<section id="screen-more" class="hidden"><div class="sectionTitle">Gestión</div><div class="grid2"><button class="btn secondary" onclick="openServiceModal()">Servicios</button><button class="btn secondary" onclick="openSupplierModal()">Proveedores</button><button class="btn secondary" onclick="openPurchaseModal()">Compras</button><button class="btn secondary" onclick="refreshAll()">Actualizar</button></div><div class="card" style="margin-top:12px"><div class="sectionTitle">Servicios</div><div id="servicesList"></div></div><div class="card"><div class="sectionTitle">Proveedores</div><div id="suppliersList"></div></div><div class="card"><div class="sectionTitle">Compras</div><div id="purchasesList"></div></div></section>
</div><nav class="bottomnav"><button class="navbtn active" data-screen="home" onclick="showScreen('home',this)"><b>⌂</b>Inicio</button><button class="navbtn" data-screen="clients" onclick="showScreen('clients',this)"><b>👥</b>Clientes</button><button class="navbtn" data-screen="sales" onclick="showScreen('sales',this)"><b>💳</b>Ventas</button><button class="navbtn" data-screen="accounts" onclick="showScreen('accounts',this)"><b>📺</b>Cuentas</button><button class="navbtn" data-screen="more" onclick="showScreen('more',this)"><b>☰</b>Más</button></nav></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div>
<script>
const SUPABASE_URL='https://ktsszfiqrteklmtgtbgv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_tlT-G0ziq1E5Cwnp2AEx3w_Ip0Xzi-6';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let state={clients:[],services:[],suppliers:[],purchases:[],accounts:[],slots:[],sales:[],saleItems:[],assignments:[]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date().toISOString().slice(0,10),addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},daysUntil=d=>Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000);
const money=(n,c='ARS')=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c==='USDT'?'USD':c,maximumFractionDigits:2}).format(Number(n||0)).replace('US$','USDT ');
async function login(){loginMsg.textContent='Ingresando...';const {data,error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){loginMsg.textContent=error.message;return}await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){authView.classList.add('hidden');appView.classList.remove('hidden');await refreshAll()}
async function refreshAll(){const qs=await Promise.all([sb.from('clients').select('*').order('name'),sb.from('services').select('*').order('name'),sb.from('suppliers').select('*').order('name'),sb.from('purchases').select('*').order('purchased_at',{ascending:false}),sb.from('accounts').select('*').order('created_at',{ascending:false}),sb.from('account_slots').select('*').order('slot_number'),sb.from('sales').select('*').order('sold_at',{ascending:false}),sb.from('sale_items').select('*').order('start_date',{ascending:false}),sb.from('slot_assignments').select('*').order('assigned_at',{ascending:false}),
    sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50),
    sb.from('push_subscriptions').select('*').eq('active',true)]);['clients','services','suppliers','purchases','accounts','slots','sales','saleItems','assignments'].forEach((k,i)=>state[k]=qs[i].data||[]);renderAll()}
function showScreen(n,b){document.querySelectorAll('[id^=screen-]').forEach(x=>x.classList.add('hidden'));$('screen-'+n).classList.remove('hidden');document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));(b||document.querySelector(`[data-screen="${n}"]`))?.classList.add('active');renderAll()}
function clientBy(id){return state.clients.find(x=>x.id===id)}function serviceBy(id){return state.services.find(x=>x.id===id)}function supplierBy(id){return state.suppliers.find(x=>x.id===id)}function accountBy(id){return state.accounts.find(x=>x.id===id)}function slotBy(id){return state.slots.find(x=>x.id===id)}function saleBy(id){return state.sales.find(x=>x.id===id)}function activeAssignItem(id){return state.assignments.find(x=>x.sale_item_id===id&&!x.released_at)}function activeAssignSlot(id){return state.assignments.find(x=>x.account_slot_id===id&&!x.released_at)}
function renderAll(){mClients.textContent=state.clients.length;mPending.textContent=state.saleItems.filter(i=>['renewal_pending','payment_pending'].includes(i.workflow_status)).length;const occ=new Set(state.assignments.filter(a=>!a.released_at).map(a=>a.account_slot_id));mSlots.textContent=state.slots.filter(s=>s.active&&!occ.has(s.id)).length;mExpiring.textContent=state.saleItems.filter(i=>i.end_date&&daysUntil(i.end_date)>=0&&daysUntil(i.end_date)<=7).length;renderClients();renderSales();renderAccounts();renderMore();renderHome()}
function renderHome(){const a=state.saleItems.filter(i=>i.end_date&&daysUntil(i.end_date)>=0&&daysUntil(i.end_date)<=7);homeExpiring.innerHTML=a.length?a.map(i=>{const s=saleBy(i.sale_id),c=s&&clientBy(s.client_id);return `<div class="item"><b>${esc(c?.name||'')}</b><div class="tiny muted">${esc(serviceBy(i.service_id)?.name||'')} · vence ${esc(i.end_date)}</div></div>`}).join(''):'<div class="muted">Nada próximo a vencer.</div>'}
function renderClients(){const q=(clientSearch?.value||'').toLowerCase();const a=state.clients.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone_raw||'').includes(q));clientsList.innerHTML=a.length?a.map(c=>`<div class="item"><div class="row between"><div><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.phone_e164||c.phone_raw||'')}</div></div><button class="btn secondary small" onclick="openClientModal('${c.id}')">Editar</button></div></div>`).join(''):'<div class="muted">Sin clientes.</div>'}
function renderSales(){salesList.innerHTML=state.saleItems.length?state.saleItems.map(i=>{const s=saleBy(i.sale_id),c=s&&clientBy(s.client_id),as=activeAssignItem(i.id),sl=as&&slotBy(as.account_slot_id),ac=sl&&accountBy(sl.account_id);return `<div class="item"><div class="row between"><div><b>${esc(c?.name||'')}</b><div class="tiny muted">${esc(serviceBy(i.service_id)?.name||'')} · ${esc(as?.profile_name||'Sin perfil')}</div></div><span class="badge">${esc(i.workflow_status)}</span></div><div class="tiny muted">${esc(ac?.login_email||'Sin cuenta')} · vence ${esc(i.end_date||'-')}</div><div class="tiny">Ingreso: <b>${money(i.allocated_revenue,s?.currency||'ARS')}</b></div><div class="row wrap" style="margin-top:8px"><button class="btn warn small" onclick="markItem('${i.id}','renewal_pending')">Pend. renovar</button><button class="btn warn small" onclick="markItem('${i.id}','payment_pending')">Pend. cobrar</button><button class="btn ok small" onclick="renewItem('${i.id}')">Renovó</button><button class="btn danger small" onclick="releaseItem('${i.id}')">Liberar</button></div></div>`}).join(''):'<div class="muted">Sin ventas.</div>'}
function renderAccounts(){accountsList.innerHTML=state.accounts.length?state.accounts.map(a=>{const sl=state.slots.filter(s=>s.account_id===a.id),o=sl.filter(s=>activeAssignSlot(s.id)).length;return `<div class="item"><b>${esc(serviceBy(a.service_id)?.name||'')}</b><div class="tiny muted">${esc(a.login_email||'Sin correo')}</div><div class="tiny">${a.account_mode==='provider_managed'?'Perfiles comprados: '+sl.length+' · libres: '+(sl.length-o):o+'/'+sl.length+' ocupados · '+(sl.length-o)+' libres'}</div><div class="tiny muted">${a.account_mode==='provider_managed'?'Administrada por proveedor':'Cuenta completa administrada por vos'}</div><div class="row wrap" style="margin-top:8px"><button class="btn secondary small" onclick="openAccountModal('${a.id}')">Editar</button><button class="btn warn small" onclick="openMigrateModal('${a.id}')">Migrar</button></div></div>`}).join(''):'<div class="muted">Sin cuentas.</div>'}
function renderNotifications(){
  const el=document.getElementById('notificationsList');
  if(!el)return;
  const arr=state.notifications||[];
  el.innerHTML=arr.length?arr.slice(0,12).map(n=>`<div class="item">
    <div class="row between"><b>${esc(n.title)}</b>${n.read_at?'<span class="badge ok">Leída</span>':'<span class="badge warn">Nueva</span>'}</div>
    <div class="tiny muted" style="margin-top:4px">${esc(n.body)}</div>
  </div>`).join(''):'<div class="empty">Todavía no hay notificaciones.</div>';
}
function updatePushBadge(){
  const el=document.getElementById('pushStatusBadge');if(!el)return;
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    el.textContent='No compatible';el.className='badge danger';return;
  }
  if(Notification.permission==='granted' && (state.pushSubscriptions||[]).length){
    el.textContent='Activadas';el.className='badge ok';
  }else if(Notification.permission==='denied'){
    el.textContent='Bloqueadas';el.className='badge danger';
  }else{
    el.textContent='Desactivadas';el.className='badge warn';
  }
}
function renderMore(){servicesList.innerHTML=state.services.map(s=>`<div class="item"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.default_account_mode||'')} · capacidad ${s.default_capacity||'-'}</div></div>`).join('')||'<div class="muted">Sin servicios.</div>';suppliersList.innerHTML=state.suppliers.map(s=>`<div class="item"><b>${esc(s.name)}</b></div>`).join('')||'<div class="muted">Sin proveedores.</div>';purchasesList.innerHTML=state.purchases.map(p=>`<div class="item"><b>${esc(serviceBy(p.service_id)?.name||'')}</b><div class="tiny muted">${esc(supplierBy(p.supplier_id)?.name||'Sin proveedor')} · ${money(p.total_cost,p.currency)} · vence ${esc(p.expires_at||'-')}</div></div>`).join('')||'<div class="muted">Sin compras.</div>'}
function openModal(h){sheet.innerHTML=h;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function normalizePhone(raw){let d=(raw||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('549')||d.startsWith('598')||d.startsWith('56'))return'+'+d;if(d.startsWith('54'))return'+54'+(d.slice(2).startsWith('9')?'':'9')+d.slice(2);if(d.length>=9&&d.length<=11)return'+549'+d.replace(/^0/,'');return'+'+d}
function openClientModal(id=''){const c=id?clientBy(id):{};openModal(`<div class="sectionTitle">${id?'Editar':'Nuevo'} cliente</div><label>Nombre</label><input id="fName" value="${esc(c?.name||'')}"><label>Teléfono</label><input id="fPhone" value="${esc(c?.phone_raw||c?.phone_e164||'')}"><label>Notas</label><textarea id="fNotes">${esc(c?.notes||'')}</textarea><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveClient('${id}')">Guardar</button>`)}
async function saveClient(id){const raw=fPhone.value.trim(),p={name:fName.value.trim(),phone_raw:raw,phone_e164:normalizePhone(raw),notes:fNotes.value.trim()||null};const r=id?await sb.from('clients').update(p).eq('id',id):await sb.from('clients').insert(p);if(r.error)return alert(r.error.message);closeModal();refreshAll()}
function openServiceModal(){openModal(`<div class="sectionTitle">Nuevo servicio</div><label>Nombre</label><input id="fsName"><label>Precio referencia</label><input id="fsPrice" type="number"><label>Moneda</label><select id="fsCurr"><option>ARS</option><option>USD</option><option>USDT</option><option>UYU</option><option>CLP</option></select><label>Tipo</label><select id="fsMode"><option value="full_account">Cuenta completa administrada por mí</option><option value="provider_managed">Perfil comprado a proveedor</option></select><label>Capacidad</label><input id="fsCap" type="number" value="5"><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveService()">Guardar</button>`)}
async function saveService(){const r=await sb.from('services').insert({name:fsName.value.trim(),reference_price:fsPrice.value||null,reference_currency:fsCurr.value,default_account_mode:fsMode.value,default_capacity:Number(fsCap.value||1)});if(r.error)return alert(r.error.message);closeModal();refreshAll()}
function openSupplierModal(){openModal(`<div class="sectionTitle">Nuevo proveedor</div><label>Nombre</label><input id="fpName"><label>Contacto</label><input id="fpContact"><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveSupplier()">Guardar</button>`)}
async function saveSupplier(){const r=await sb.from('suppliers').insert({name:fpName.value.trim(),contact:fpContact.value.trim()||null});if(r.error)return alert(r.error.message);closeModal();refreshAll()}
const serviceOpts=()=>state.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''),supplierOpts=()=>'<option value="">Sin proveedor</option>'+state.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''),clientOpts=()=>state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
function openPurchaseModal(){if(!state.services.length){return openServiceModal()} openModal(`<div class="sectionTitle">Nueva compra</div><label>Servicio</label><select id="purService">${serviceOpts()}</select><label>Proveedor</label><select id="purSupplier">${supplierOpts()}</select><label>¿Qué compraste?</label><select id="purType" onchange="purCap.closest('label')"><option value="full_account">Cuenta completa</option><option value="provider_managed">Un perfil dentro de una cuenta del proveedor</option></select><label>Costo</label><input id="purCost" type="number"><label>Moneda</label><select id="purCurr"><option>USDT</option><option>USD</option><option>ARS</option><option>UYU</option><option>CLP</option></select><label>Vence</label><input id="purExp" type="date" value="${addDays(today(),30)}"><label>Correo</label><input id="purEmail"><label>Capacidad</label><input id="purCap" type="number" value="5"><button class="btn primary" style="width:100%;margin-top:10px" onclick="savePurchase()">Guardar compra y crear cuenta</button>`)}
async function savePurchase(){const p={supplier_id:purSupplier.value||null,service_id:purService.value,purchase_type:(purType.value==='provider_managed'?'provider_profile':'full_account'),total_cost:Number(purCost.value||0),currency:purCurr.value,purchased_at:today(),expires_at:purExp.value};const pr=await sb.from('purchases').insert(p).select().single();if(pr.error)return alert(pr.error.message);const ar=await sb.from('accounts').insert({service_id:p.service_id,purchase_id:pr.data.id,supplier_id:p.supplier_id,login_email:purEmail.value.trim()||null,account_mode:p.purchase_type,capacity:Number(purCap.value||1),provider_expires_at:p.expires_at});if(ar.error)return alert(ar.error.message);closeModal();refreshAll()}
function openAccountModal(id=''){if(!state.services.length&&!id){return openServiceModal()} const a=id?accountBy(id):{};openModal(`<div class="sectionTitle">${id?'Editar':'Nueva'} cuenta</div><label>Servicio</label><select id="accService">${serviceOpts()}</select><label>Correo</label><input id="accEmail" value="${esc(a?.login_email||'')}"><label>Tipo</label><select id="accMode"><option value="full_account">Cuenta completa administrada por mí</option><option value="provider_managed">Perfil comprado a proveedor</option></select><label>Capacidad</label><input id="accCap" type="number" value="${a?.capacity||5}" ${id?'disabled':''}><label>Vence proveedor</label><input id="accExp" type="date" value="${esc(a?.provider_expires_at||addDays(today(),30))}"><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveAccount('${id}')">Guardar</button>`);if(id){accService.value=a.service_id;accMode.value=a.account_mode}}
async function saveAccount(id){const p={service_id:accService.value,login_email:accEmail.value.trim()||null,account_mode:accMode.value,provider_expires_at:accExp.value||null};if(!id)p.capacity=Number(accCap.value||1);const r=id?await sb.from('accounts').update(p).eq('id',id):await sb.from('accounts').insert(p);if(r.error)return alert(r.error.message);closeModal();refreshAll()}
function freeSlotOptionsForAccount(accountId){
  const occ=new Set(state.assignments.filter(a=>!a.released_at).map(a=>a.account_slot_id));
  return state.slots.filter(s=>s.account_id===accountId&&s.active&&!occ.has(s.id))
    .map(s=>`<option value="${s.id}">Cupo ${s.slot_number}${s.custom_label?' · '+esc(s.custom_label):''}</option>`).join('');
}
function findClientByName(name){const n=(name||'').trim().toLowerCase();return state.clients.find(c=>(c.name||'').trim().toLowerCase()===n)}
function findServiceByName(name){const n=(name||'').trim().toLowerCase();return state.services.find(s=>(s.name||'').trim().toLowerCase()===n)}
function findAccountByEmail(email,serviceId){const e=(email||'').trim().toLowerCase();return state.accounts.find(a=>(a.login_email||'').trim().toLowerCase()===e&&(!serviceId||a.service_id===serviceId)&&a.status==='active')}
function clientNameOptions(){return state.clients.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}
function serviceNameOptions(){return state.services.map(s=>`<option value="${esc(s.name)}"></option>`).join('')}
function accountEmailOptions(){return state.accounts.filter(a=>a.status==='active'&&a.login_email).map(a=>`<option value="${esc(a.login_email)}"></option>`).join('')}

function firstMatch(text, patterns){
  for(const p of patterns){
    const m=text.match(p);
    if(m&&m[1]) return m[1].trim();
  }
  return '';
}
function parseSaleText(text){
  const t=String(text||'').replace(/\r/g,'');
  const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);

  const email=(t.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';

  const phone=firstMatch(t,[
    /(?:tel[eé]fono|telefono|whatsapp|celular|n[uú]mero)\s*[:\-]?\s*([+\d][\d\s().-]{7,})/i
  ]);

  const client=firstMatch(t,[
    /(?:cliente|nombre(?:\s+del\s+cliente)?)\s*[:\-]\s*([^\n]+)/i
  ]);

  const password=firstMatch(t,[
    /(?:contrase(?:ñ|n)a|password|clave|pass|pwd)\s*[:=\-]?\s*([^\n|]+)/i
  ]);

  const profile=firstMatch(t,[
    /perfil(?:\s*(?:n[º°o.]|numero|número)?)?\s*[:=\-]?\s*([^\n|]+)/i
  ]);

  const devices=firstMatch(t,[
    /(\d+)\s*(?:dispositivos?|pantallas?)/i,
    /(?:dispositivos?|pantallas?)\s*[:=\-]?\s*(\d+)/i
  ]);

  let service=firstMatch(t,[
    /(?:servicio|plataforma|producto)\s*[:=\-]\s*([^\n]+)/i
  ]);

  if(!service){
    const known=[
      'Netflix','Disney+','Disney Plus','Prime Video','Amazon Prime',
      'Max','HBO Max','Paramount+','Spotify','YouTube Premium',
      'Crunchyroll','Apple TV+','Vix','Alfa TV','Flujo TV'
    ];
    const lower=t.toLowerCase();
    service=known.find(x=>lower.includes(x.toLowerCase()))||'';
  }

  const cost=firstMatch(t,[
    /(?:costo|cost|precio proveedor|price)\s*[:=\-]?\s*(?:usd|usdt|\$)?\s*([\d.,]+)/i
  ]);

  let costCurrency='';
  if(/\busdt\b/i.test(t)) costCurrency='USDT';
  else if(/\busd\b/i.test(t)) costCurrency='USD';
  else if(/\buyu\b/i.test(t)) costCurrency='UYU';
  else if(/\bclp\b/i.test(t)) costCurrency='CLP';
  else if(/\bars\b/i.test(t)) costCurrency='ARS';

  return {client,phone,service,email,profile,password,devices,cost,costCurrency};
}
function fillSaleFromExtractor(){
  const parsed=parseSaleText(document.getElementById('saleExtractorText').value);
  if(parsed.client) saleClientName.value=parsed.client;
  if(parsed.phone) saleClientPhone.value=parsed.phone;
  syncSaleClient();

  let row=document.querySelector('.saleRow');
  if(!row){addSaleRow();row=document.querySelector('.saleRow')}
  if(parsed.service) row.querySelector('.siServiceName').value=parsed.service;
  if(parsed.email) row.querySelector('.siAccountEmail').value=parsed.email;
  if(parsed.profile) row.querySelector('.siProfile').value=parsed.profile;
  if(parsed.password){
    row.querySelector('.siPassword').value=parsed.password;
    row.querySelector('.siIncludePassword').checked=true;
  }
  if(parsed.devices) row.querySelector('.siDevices').value=parsed.devices;
  if(parsed.cost){
    const costTarget=row.querySelector('.siProviderCost')||row.querySelector('.siExistingCost');
    if(costTarget) costTarget.value=String(parsed.cost).replace(',','.');
  }
  if(parsed.costCurrency){
    const currTarget=row.querySelector('.siProviderCurrency')||row.querySelector('.siExistingCurrency');
    if(currTarget) currTarget.value=parsed.costCurrency;
  }
  syncSaleRow(row.querySelector('.siServiceName'));
  if(parsed.email) syncSaleRow(row.querySelector('.siAccountEmail'));
}

function autoEndDate(el){
  const row=el.closest('.saleRow'),sv=findServiceByName(row.querySelector('.siServiceName').value);
  row.querySelector('.siEnd').value=addDays(el.value,sv?.default_duration_days||30);
}
function syncAccountMode(el){
  const row=el.closest('.saleRow');
  const cap=row.querySelector('.siCapacityWrap');
  const provider=row.querySelector('.siProviderPurchase');
  if(el.value==='full_account'){
    cap.classList.remove('hidden');
    provider.classList.add('hidden');
  }else{
    cap.classList.add('hidden');
    provider.classList.remove('hidden');
    row.querySelector('.siCapacity').value=1;
  }
}

function syncProviderExistingAction(el){
  const row=el.closest('.saleRow');
  const buy=row.querySelector('.siBuyNewProfile');
  const convert=row.querySelector('.siConvertFull');
  const slotWrap=row.querySelector('.siExistingSlot');
  buy.classList.add('hidden');
  convert.classList.add('hidden');

  if(el.value==='buy_new'){
    buy.classList.remove('hidden');
    slotWrap.classList.add('hidden');
  }else if(el.value==='convert_full'){
    convert.classList.remove('hidden');
    slotWrap.classList.add('hidden');
  }else{
    slotWrap.classList.remove('hidden');
  }
}

function syncSaleRow(el){
  const row=el.closest('.saleRow');if(!row)return;
  const serviceName=row.querySelector('.siServiceName').value.trim();
  const sv=findServiceByName(serviceName);
  const serviceHint=row.querySelector('.siServiceHint');
  const mode=row.querySelector('.siMode');
  const cap=row.querySelector('.siCapacity');

  if(sv){
    serviceHint.innerHTML=`✓ Servicio existente: <b>${esc(sv.name)}</b>.`;
    if(sv.default_account_mode)mode.value=sv.default_account_mode;
    cap.value=sv.default_capacity||((mode.value==='full_account')?5:1);
    row.querySelector('.siEnd').value=addDays(row.querySelector('.siStart').value,sv.default_duration_days||30);
  }else if(serviceName){
    serviceHint.innerHTML=`Nuevo servicio: <b>${esc(serviceName)}</b> se guardará automáticamente.`;
  }else{
    serviceHint.textContent='Si el servicio no existe, se creará automáticamente.';
  }

  syncAccountMode(mode);

  const email=row.querySelector('.siAccountEmail').value.trim();
  const ac=email?findAccountByEmail(email,sv?.id):null;
  const ah=row.querySelector('.siAccountHint');
  const newBox=row.querySelector('.siNewAccount');
  const slotWrap=row.querySelector('.siExistingSlot');
  const slotSelect=row.querySelector('.siSlot');
  const providerExisting=row.querySelector('.siProviderExistingActions');

  providerExisting.classList.add('hidden');

  if(ac){
    const free=state.slots.filter(s=>s.account_id===ac.id&&s.active&&!activeAssignSlot(s.id));
    newBox.classList.add('hidden');

    if(ac.account_mode==='provider_managed'){
      ah.innerHTML=`✓ Este correo ya existe como <b>cuenta administrada por proveedor</b>. Tenés ${state.slots.filter(s=>s.account_id===ac.id).length} perfil(es) comprado(s) y ${free.length} libre(s).`;
      providerExisting.classList.remove('hidden');
      slotSelect.innerHTML=freeSlotOptionsForAccount(ac.id)||'<option value="">No hay perfiles comprados libres</option>';
      const action=row.querySelector('.siProviderAction');
      action.value=free.length?'use_free':'buy_new';
      syncProviderExistingAction(action);
    }else{
      ah.innerHTML=`✓ Cuenta completa existente: <b>${esc(ac.login_email||'')}</b> · ${free.length} cupo(s) libre(s).`;
      slotWrap.classList.remove('hidden');
      slotSelect.innerHTML=freeSlotOptionsForAccount(ac.id)||'<option value="">Sin cupos libres</option>';
    }
  }else{
    slotWrap.classList.add('hidden');
    newBox.classList.remove('hidden');
    if(email) ah.innerHTML=`Correo nuevo: <b>${esc(email)}</b>. Indicá si lo administrás completo o si el proveedor sólo te vendió este perfil.`;
    else ah.textContent='Escribí un correo. Si ya existe, MISAKROOS lo reconocerá.';
  }
}
function updateSaleDistribution(){
  if(!window.saleDist)return;
  const total=Number(saleTotal?.value||0);
  const sum=[...document.querySelectorAll('.siRevenue')].reduce((a,x)=>a+Number(x.value||0),0);
  const diff=total-sum;
  saleDist.innerHTML=`Total cobrado: <b>${total.toFixed(2)}</b> · atribuido: <b>${sum.toFixed(2)}</b> · diferencia: <b>${diff.toFixed(2)}</b>`;
}

async function resolveClientForSale(){
  const name=saleClientName.value.trim();if(!name)throw new Error('Ingresá el nombre del cliente.');
  let c=findClientByName(name);if(c)return c;
  const raw=saleClientPhone.value.trim();
  const r=await sb.from('clients').insert({name,phone_raw:raw||null,phone_e164:normalizePhone(raw)||null}).select().single();
  if(r.error)throw r.error;
  state.clients.push(r.data);return r.data;
}
async function resolveServiceForRow(row){
  const name=row.querySelector('.siServiceName').value.trim();if(!name)throw new Error('Hay un ítem sin nombre de servicio.');
  let sv=findServiceByName(name);if(sv)return sv;
  const mode=row.querySelector('.siMode').value;
  const capacity=mode==='full_account'?Number(row.querySelector('.siCapacity').value||1):1;
  const r=await sb.from('services').insert({name,default_duration_days:30,default_account_mode:mode,default_capacity:capacity,active:true}).select().single();
  if(r.error)throw r.error;
  state.services.push(r.data);return r.data;
}
async function createProviderProfilePurchase(row,service,existing=false){
  const supplierSel=existing?row.querySelector('.siExistingSupplier'):row.querySelector('.siSupplier');
  const costEl=existing?row.querySelector('.siExistingCost'):row.querySelector('.siProviderCost');
  const currEl=existing?row.querySelector('.siExistingCurrency'):row.querySelector('.siProviderCurrency');
  const dateEl=existing?row.querySelector('.siExistingPurchaseDate'):row.querySelector('.siProviderPurchaseDate');
  const expEl=existing?row.querySelector('.siExistingExpiry'):row.querySelector('.siProviderExpiry');

  const pr=await sb.from('purchases').insert({
    supplier_id:supplierSel?.value||null,
    service_id:service.id,
    purchase_type:'provider_profile',
    total_cost:Number(costEl?.value||0),
    currency:currEl?.value||'USDT',
    purchased_at:dateEl?.value||today(),
    expires_at:expEl?.value||addDays(today(),30),
    status:'active'
  }).select().single();
  if(pr.error)throw pr.error;
  return pr.data;
}

async function resolveAccountAndSlot(row,service){
  const email=row.querySelector('.siAccountEmail').value.trim();
  if(!email)return {account:null,slotId:null,purchaseId:null};

  let ac=findAccountByEmail(email,service.id);

  if(ac){
    const typedPassword=row.querySelector('.siPassword')?.value.trim();
    if(typedPassword && typedPassword!==ac.login_password){
      const upr=await sb.from('accounts').update({login_password:typedPassword}).eq('id',ac.id);
      if(upr.error)throw upr.error;
      ac.login_password=typedPassword;
    }
    if(ac.account_mode==='full_account'){
      const chosen=row.querySelector('.siSlot').value;
      if(!chosen)throw new Error(`La cuenta completa ${email} no tiene un cupo libre seleccionado.`);
      return {account:ac,slotId:chosen,purchaseId:null};
    }

    const action=row.querySelector('.siProviderAction').value;

    if(action==='use_free'){
      const chosen=row.querySelector('.siSlot').value;
      if(!chosen)throw new Error(`No hay un perfil comprado libre en ${email}.`);
      return {account:ac,slotId:chosen,purchaseId:null};
    }

    if(action==='buy_new'){
      const purchase=await createProviderProfilePurchase(row,service,true);
      const rr=await sb.rpc('add_provider_profile',{
        p_account_id:ac.id,
        p_purchase_id:purchase.id
      });
      if(rr.error)throw rr.error;
      const sl=await sb.from('account_slots').select('*').eq('id',rr.data).single();
      if(sl.error)throw sl.error;
      state.slots.push(sl.data);
      return {account:ac,slotId:sl.data.id,purchaseId:purchase.id};
    }

    if(action==='convert_full'){
      const capacity=Number(row.querySelector('.siConvertCapacity').value||0);
      if(capacity<1)throw new Error('Indicá la capacidad total de la cuenta.');
      const rr=await sb.rpc('convert_provider_account_to_full',{
        p_account_id:ac.id,
        p_total_capacity:capacity,
        p_purchase_id:null
      });
      if(rr.error)throw rr.error;
      await refreshAll();
      ac=findAccountByEmail(email,service.id);
      const occ=new Set(state.assignments.filter(a=>!a.released_at).map(a=>a.account_slot_id));
      const free=state.slots.filter(s=>s.account_id===ac.id&&s.active&&!occ.has(s.id));
      if(!free.length)throw new Error('La cuenta convertida no tiene cupos libres.');
      return {account:ac,slotId:free[0].id,purchaseId:null};
    }
  }

  const mode=row.querySelector('.siMode').value;

  if(mode==='provider_managed'){
    const purchase=await createProviderProfilePurchase(row,service,false);

    const ar=await sb.from('accounts').insert({
      service_id:service.id,
      purchase_id:purchase.id,
      supplier_id:purchase.supplier_id,
      login_email:email,
      account_mode:'provider_managed',
      capacity:1,
      status:'active',
      provider_expires_at:purchase.expires_at,
      login_password:row.querySelector('.siPassword')?.value.trim()||null
    }).select().single();
    if(ar.error)throw ar.error;
    ac=ar.data;

    const sl=await sb.from('account_slots').select('*').eq('account_id',ac.id).order('slot_number');
    if(sl.error)throw sl.error;
    state.accounts.push(ac);
    state.slots.push(...(sl.data||[]));
    const first=(sl.data||[])[0];
    if(!first)throw new Error(`No se pudo crear el perfil comprado en ${email}.`);
    return {account:ac,slotId:first.id,purchaseId:purchase.id};
  }

  const capacity=Number(row.querySelector('.siCapacity').value||1);
  if(capacity<1)throw new Error(`La cuenta ${email} necesita al menos 1 cupo.`);

  const ar=await sb.from('accounts').insert({
    service_id:service.id,
    login_email:email,
    account_mode:'full_account',
    capacity,
    status:'active',
    login_password:row.querySelector('.siPassword')?.value.trim()||null
  }).select().single();
  if(ar.error)throw ar.error;
  ac=ar.data;

  const sl=await sb.from('account_slots').select('*').eq('account_id',ac.id).order('slot_number');
  if(sl.error)throw sl.error;
  state.accounts.push(ac);
  state.slots.push(...(sl.data||[]));
  const first=(sl.data||[])[0];
  if(!first)throw new Error(`No se pudo generar el primer cupo de ${email}.`);
  return {account:ac,slotId:first.id,purchaseId:null};
}
async function saveSale(){
  const rows=[...document.querySelectorAll('.saleRow')];if(!rows.length)return alert('Agregá al menos un servicio.');
  const total=Number(saleTotal.value||0),sum=rows.reduce((a,r)=>a+Number(r.querySelector('.siRevenue').value||0),0);
  if(Math.abs(total-sum)>.01&&!confirm(`Cobraste ${total}, pero atribuiste ${sum} entre los servicios. ¿Querés guardar igual?`))return;

  try{
    const client=await resolveClientForSale();
    const sr=await sb.from('sales').insert({
      client_id:client.id,
      sold_at:saleDate.value||today(),
      total_amount:total,
      currency:saleCurr.value
    }).select().single();
    if(sr.error)throw sr.error;

    for(const row of rows){
      const service=await resolveServiceForRow(row);
      const resolved=await resolveAccountAndSlot(row,service);
      const cost=row.querySelector('.siCost').value;

      const ir=await sb.from('sale_items').insert({
        sale_id:sr.data.id,
        service_id:service.id,
        allocated_revenue:Number(row.querySelector('.siRevenue').value||0),
        direct_cost:cost?Number(cost):null,
        direct_cost_currency:saleCurr.value,
        start_date:row.querySelector('.siStart').value||today(),
        end_date:row.querySelector('.siEnd').value||addDays(today(),30),
        include_password:row.querySelector('.siIncludePassword').checked,
        contracted_devices:Number(row.querySelector('.siDevices').value||1),
        delivery_notes:row.querySelector('.siDeliveryNotes').value.trim()||null,
        provider_raw_text:document.getElementById('saleExtractorText')?.value.trim()||null,
        purchase_id:resolved.purchaseId||null
      }).select().single();
      if(ir.error)throw ir.error;

      if(resolved.slotId){
        const ar=await sb.from('slot_assignments').insert({
          account_slot_id:resolved.slotId,
          sale_item_id:ir.data.id,
          client_id:client.id,
          profile_name:row.querySelector('.siProfile').value.trim()||null
        });
        if(ar.error)throw ar.error;
      }
    }

    closeModal();
    await refreshAll();
    alert('Venta guardada. MISAKROOS creó automáticamente los datos nuevos que hacían falta.');
  }catch(err){
    console.error(err);
    alert(err.message||String(err));
    await refreshAll();
  }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

async function enablePushNotifications(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
      return alert('Este navegador no admite notificaciones push web.');
    }
    if(VAPID_PUBLIC_KEY.startsWith('PEGAR_')){
      return alert('Primero falta configurar la clave pública VAPID. Te indico cómo hacerlo en el paso siguiente.');
    }

    const permission=await Notification.requestPermission();
    if(permission!=='granted')return alert('No se concedió permiso para mostrar notificaciones.');

    const reg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;

    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const j=sub.toJSON();
    const payload={
      endpoint:j.endpoint,
      p256dh:j.keys.p256dh,
      auth_key:j.keys.auth,
      user_agent:navigator.userAgent,
      device_name:navigator.platform||'Dispositivo',
      active:true,
      last_used_at:new Date().toISOString()
    };

    const r=await sb.from('push_subscriptions')
      .upsert(payload,{onConflict:'user_id,endpoint'});
    if(r.error)throw r.error;

    await refreshAll();
    alert('Notificaciones activadas en este dispositivo ✅');
  }catch(e){
    console.error(e);
    alert(e.message||String(e));
  }
}

async function markNotificationsRead(){
  const ids=(state.notifications||[]).filter(n=>!n.read_at).map(n=>n.id);
  if(!ids.length)return;
  const r=await sb.from('notifications').update({read_at:new Date().toISOString()}).in('id',ids);
  if(r.error)return alert(r.error.message);
  await refreshAll();
}
